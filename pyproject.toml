[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pairbst-benchmark"
version = "0.1.0"
description = "Reproducible PAIR-BST validation and benchmarking pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "h5py==3.14.0",
  "numpy==2.1.2",
  "pandas==2.3.2",
  "Pillow==11.0.0",
  "PyYAML==6.0.2",
  "scikit-learn==1.7.1",
  "scipy==1.16.1",
  "timm==1.0.19",
  "torch==2.8.0",
  "torchvision==0.23.0",
]

[project.scripts]
pairbst = "pairbst.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
